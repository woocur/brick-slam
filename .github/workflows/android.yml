name: Android build

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Decode upload key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets; the bundle is built unsigned."
          fi
      - name: Build
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brick-slam-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/debug/*.apk
      - name: Publish test APK and bundle
        working-directory: app/android/app/build/outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/debug/app-debug.apk "$RUNNER_TEMP/brick-slam-test.apk"
          cp bundle/release/app-release.aab "$RUNNER_TEMP/brick-slam-release.aab"
          # rolling pre-release so the newest test APK is always at the same place
          gh release delete test-build --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create test-build "$RUNNER_TEMP/brick-slam-test.apk" -R "$GITHUB_REPOSITORY" --prerelease \
            --title "Test build #${{ github.run_number }}" --notes "Install brick-slam-test.apk on an Android phone to try the app. Ads are Google test ads."
          # bundle for Play upload goes to the builds branch (signed later with the upload key)
          cd "$RUNNER_TEMP" && mkdir out && cp brick-slam-release.aab out/ && cd out
          git init -q -b builds && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build #${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
