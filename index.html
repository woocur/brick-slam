<style>
/* Layout: phone-first. A scrolling home (hero board, start buttons, how-to) and a fixed full-screen game view: HUD strip, square board framed by four charge bars. Deliberately single dark theme. */
:root {
  --ground: #07050f;
  --board: #0d0a1c;
  --line: #2a2150;
  --brick: #ff3fa4;
  --brick-hi: #ffa6dc;
  --brick-lo: #4a0c33;
  --glow: #2ef2ff;
  --fever: #ffd84d;
  --ink: #f4f1ff;
  --muted: #958fbf;
  --danger: #ff4d5e;
  --hot: #ff3fa4;
  --violet: #8a4dff;
  --neon: "Monoton", "Black Han Sans", sans-serif;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(90% 45% at 50% 62%, rgba(255, 63, 164, .28) 0%, rgba(138, 77, 255, .12) 40%, rgba(7, 5, 15, 0) 72%) fixed,
    radial-gradient(120% 60% at 50% -10%, #1d1240 0%, rgba(29, 18, 64, 0) 60%) fixed, var(--ground);
  color: var(--ink); font-family: var(--body);
  margin: 0; overscroll-behavior: none; word-break: keep-all;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
body.playing { overflow: hidden; touch-action: none; }
button { touch-action: manipulation; }
/* synthwave floor: a perspective grid that scrolls toward you, one line per beat while a song plays */
.floor { position: fixed; left: -50%; right: -50%; bottom: 0; height: 46vh; pointer-events: none; z-index: -1; perspective: 260px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to top, #000 30%, transparent); mask-image: linear-gradient(to top, #000 30%, transparent); }
.floor::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 300%; transform-origin: 50% 100%; transform: rotateX(64deg);
  background-image: linear-gradient(rgba(255, 63, 164, .55) 2px, transparent 2px), linear-gradient(90deg, rgba(46, 242, 255, .32) 2px, transparent 2px);
  background-size: 64px 64px; animation: floor var(--beat, .6s) linear infinite; }
@keyframes floor { to { background-position: 0 64px; } }
body.playing .floor { height: 34vh; opacity: .7; }

/* ---------- home ---------- */
.home {
  max-width: 440px; margin-inline: auto; padding-inline: 20px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  display: flex; flex-direction: column; gap: 28px; box-sizing: border-box;
}
.home { min-height: 100%; }
.view { display: flex; flex-direction: column; gap: 18px; }
.view .back { align-self: flex-start; }
.title { gap: 28px; min-height: calc(100svh - 64px); justify-content: center; }
.title h1 { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 18vw, 76px); line-height: .95; margin: 0; letter-spacing: .01em; text-align: center; }
.neontitle { position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4vh; }
.neontitle .sun { position: absolute; z-index: -1; top: 0; bottom: 0; height: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  background: linear-gradient(180deg, #ffd84d 0%, #ff7a59 45%, #ff3fa4 100%); opacity: .85;
  -webkit-mask-image: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88%); mask-image: linear-gradient(180deg, #000 0 52%, transparent 52% 56%, #000 56% 64%, transparent 64% 69%, #000 69% 76%, transparent 76% 82%, #000 82% 88%, transparent 88%);
  filter: drop-shadow(0 0 40px rgba(255, 63, 164, .7)); }
.neontitle h1 { font-family: var(--neon); font-weight: 400; margin: 0; text-align: center; line-height: 1.02; letter-spacing: .02em;
  font-size: clamp(50px, 16vw, 78px); display: flex; flex-direction: column; }
.neontitle .n1 { color: #e9fdff; text-shadow: 0 0 4px #fff, 0 0 12px var(--glow), 0 0 28px var(--glow), 0 0 54px rgba(46, 242, 255, .6); }
.neontitle .n2 { color: #ffe6f4; text-shadow: 0 0 4px #fff, 0 0 12px var(--hot), 0 0 28px var(--hot), 0 0 54px rgba(255, 63, 164, .7); animation: flicker 5s infinite; }
.neontitle .sub { margin: 4px 0 0; font-family: var(--display); font-size: 18px; letter-spacing: .5em; padding-left: .5em; color: var(--fever);
  text-shadow: 0 0 10px rgba(255, 216, 77, .8); }
@keyframes flicker { 0%, 7%, 9%, 11%, 60%, 100% { opacity: 1; } 8%, 10% { opacity: .35; } 61% { opacity: .7; } }
.title h1 em { font-style: normal; color: var(--glow); }
/* short screens (landscape phones, game portals): keep each view on one screen */
@media (max-height: 760px) {
  .home { padding-block: 16px 20px; }
  .title { gap: 16px; min-height: calc(100svh - 36px); }
  .title .play { gap: 8px; }
  .title .btn { padding-block: 10px; }
  .view { gap: 12px; }
}
@media (min-width: 720px) and (max-height: 760px) {
  .home { max-width: 760px; }
  .title .play, .sizepick, #okBtn { width: 100%; max-width: 420px; align-self: center; }
  .how ol { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .how li { grid-template-columns: 1fr; gap: 6px; }
  .how li div { font-size: 13px; line-height: 1.45; }
  .how .kinds { gap: 2px; }
  .how .kinds span { font-size: 12px; }
}
.langsw {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; align-self: center; width: 220px;
  padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--board); cursor: pointer; margin-top: 6px;
}
.langsw span { position: relative; z-index: 1; font-family: var(--body); font-size: 14px; padding: 8px 0; color: var(--muted); text-align: center; transition: color .2s; }
.langsw i { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--line); transition: transform .25s cubic-bezier(.3, .7, .3, 1); }
.langsw[aria-checked="true"] i { transform: translateX(100%); }
.langsw[aria-checked="false"] span:first-child, .langsw[aria-checked="true"] span:nth-child(2) { color: var(--ink); }
.langsw:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.sizepick { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.sizepick .tabs button { font-size: 15px; padding: 7px 14px; }

.mini { --u: min(54px, 13vw); position: relative; width: calc(var(--u) * 4 + 52px); aspect-ratio: 1; max-width: 100%; align-self: center; }
.mini .grid {
  position: absolute; inset: 26px; background: var(--board); border-radius: 4px;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 25% 25%;
}
.mini .bar { position: absolute; background: var(--line); border-radius: 6px; }
.mini .bar.t { top: 8px; left: 26px; right: 26px; height: 10px; }
.mini .bar.b { bottom: 8px; left: 26px; right: 26px; height: 10px; }
.mini .bar.l { left: 8px; top: 26px; bottom: 26px; width: 10px; }
.mini .bar.r { right: 8px; top: 26px; bottom: 26px; width: 10px; overflow: visible; }
.mini .bar.r::after {
  content: ""; position: absolute; inset: 0; border-radius: 6px; background: var(--glow);
  animation: charge 2.4s infinite;
}
.mini .bar.t::after { content: ""; position: absolute; left: 35%; right: 35%; top: 0; bottom: 0; border-radius: 6px; background: var(--glow); opacity: .5; }
.mini .brick { position: absolute; width: calc(25% - 6px); aspect-ratio: 1; border-radius: 5px; background: var(--brick); box-shadow: inset 0 -5px 0 var(--brick-lo), inset 0 4px 0 -1px var(--brick-hi); }
.mini .grid { overflow: hidden; }
.mini .s1 { left: 3px; top: calc(25% + 3px); animation: slide 2.4s infinite cubic-bezier(.5, 0, .9, .6); }
.mini .s2 { left: calc(50% + 3px); top: calc(75% + 3px); }
.mini .s3 { left: calc(25% + 3px); top: 3px; }
@keyframes slide {
  0%, 25% { transform: translateX(0); opacity: 1; }
  55% { transform: translateX(calc(300% + 18px)); opacity: 1; }
  60%, 100% { transform: translateX(calc(300% + 18px)); opacity: 0; }
}
@keyframes charge {
  0%, 54% { opacity: .35; transform: scaleY(.45); box-shadow: none; }
  57% { opacity: 1; transform: scaleY(1); box-shadow: 0 0 22px 4px var(--glow); }
  100% { opacity: .9; transform: scaleY(1); box-shadow: 0 0 12px 1px var(--glow); }
}

.play { display: flex; flex-direction: column; gap: 10px; }
.btn {
  font-family: var(--display); font-size: 22px; padding: 14px 0; border-radius: 12px; border: 0;
  background: linear-gradient(90deg, var(--hot), var(--violet)); color: #fff; cursor: pointer; width: 100%; text-shadow: 0 0 10px rgba(255, 255, 255, .6);
  display: flex; justify-content: center; align-items: baseline; gap: 8px;
  box-shadow: 0 0 0 1px rgba(255, 166, 220, .6) inset, 0 0 18px rgba(255, 63, 164, .55), 0 0 42px -6px rgba(138, 77, 255, .7); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: scale(.97); box-shadow: 0 0 0 1px rgba(255, 166, 220, .8) inset, 0 0 30px rgba(255, 63, 164, .9); }
.btn small { font-family: var(--body); font-size: 13px; opacity: .75; }
.btn.alt { background: rgba(10, 8, 24, .7); color: #dffcff; border: 1.5px solid var(--glow); text-shadow: 0 0 8px rgba(46, 242, 255, .7);
  box-shadow: 0 0 14px rgba(46, 242, 255, .35), inset 0 0 14px rgba(46, 242, 255, .18); }
.btn.alt:active { box-shadow: 0 0 24px rgba(46, 242, 255, .7), inset 0 0 18px rgba(46, 242, 255, .3); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bestline { margin: 0; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bestline b { color: var(--ink); font-weight: 600; }
.privacy { display: block; margin: 0; text-align: center; font-size: 12px; color: var(--muted); opacity: .75; text-decoration: underline; text-underline-offset: 2px; }

.how h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.how ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
.how li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; counter-increment: step; }
.how li::before {
  content: counter(step); font-family: var(--display); font-size: 18px; width: 34px; height: 34px; border-radius: 9px;
  display: grid; place-items: center; background: rgba(255, 63, 164, .15); color: #fff; border: 2px solid var(--hot);
  box-shadow: 0 0 12px rgba(255, 63, 164, .6), inset 0 0 8px rgba(255, 63, 164, .4); text-shadow: 0 0 8px var(--hot);
}
.how .kinds { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; }
.how .kinds span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
.how .kinds i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.how .k-gold { border: 2px solid #ffd84d; box-shadow: 0 0 8px #ffd84d; } .how .k-stone { border: 2px solid #8f8cff; box-shadow: 0 0 8px #8f8cff; } .how .k-bomb { background: #120a14; border: 2px solid #ff4d5e; box-shadow: 0 0 8px #ff4d5e; }
.how .k-rain { background: linear-gradient(135deg, #ff5a7a, #ffcf4a, #4ae08a, #4ab0ff, #b36bff); }
.how li div { min-width: 0; font-size: 15px; line-height: 1.55; }
.how li b { display: block; font-weight: 600; margin-bottom: 2px; }
.how li span { color: var(--muted); }
.how li em { font-style: normal; }
.how .end { margin: 0; font-size: 14px; color: var(--muted); }
.how .end b { color: var(--danger); font-weight: 600; }
#diffTabs button[data-d="0"][aria-pressed="true"] { color: #b9f58a; }
#diffTabs button[data-d="2"][aria-pressed="true"] { color: var(--hot); }
#tutBtn small { color: var(--fever); }
/* song shelf: records stand in a crate; the picked one is pulled out and its vinyl slides out of the sleeve */
.shelf h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.shelfhead { display: flex; justify-content: space-between; }
.crate { --S: min(150px, 30vw); position: relative; width: 100%; max-width: 560px; align-self: center; }
.rack { position: relative; display: flex; justify-content: safe center; gap: 22px; height: calc(var(--S) * 1.53); padding: calc(var(--S) * .08) calc(var(--S) * .4) 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.rack::-webkit-scrollbar { display: none; }
.rec {
  --c1: #ff3fa4; --c2: #2ef2ff; position: relative; flex: 0 0 var(--S); height: var(--S); padding: 0; border: 0; background: none;
  cursor: pointer; transform: translateY(50%); transition: transform .45s cubic-bezier(.2, .9, .3, 1.15); z-index: 1; -webkit-tap-highlight-color: transparent;
}
.rec .sleeve {
  position: absolute; inset: 0; z-index: 2; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  padding: 10px; text-align: left; color: #fff; background: linear-gradient(155deg, var(--c1), #160b2a 70%);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .25) inset, 0 -2px 18px -4px var(--c1);
}
.rec .sleeve::before {      /* sun with stripes, like the title */
  content: ""; position: absolute; width: 78%; aspect-ratio: 1; right: -16%; bottom: -12%; border-radius: 50%;
  background: repeating-linear-gradient(180deg, transparent 0 9px, rgba(10, 6, 24, .85) 9px 13px), linear-gradient(180deg, var(--c2), var(--c1));
  opacity: .85;
}
.rec .sleeve b { position: relative; font-family: var(--display); font-weight: 400; font-size: calc(var(--S) * .13); line-height: 1.05; text-shadow: 0 0 10px rgba(0, 0, 0, .6); }
.rec .sleeve small { position: relative; font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }
.rec .disc { position: absolute; inset: 3%; z-index: 1; transition: transform .55s cubic-bezier(.2, .9, .3, 1); }
.rec .vinyl {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle, var(--c2) 0 15%, #0b0b10 15.5% 17%, transparent 17.5%),
    repeating-radial-gradient(circle, #121218 0 2px, #1d1d26 2px 3px);
  box-shadow: 0 0 0 1px #2a2a35, 0 0 16px -2px var(--c1);
}
.rec .vinyl::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 20%, rgba(255, 255, 255, .12) 25%, transparent 30% 70%, rgba(255, 255, 255, .08) 75%, transparent 80%); }
.rec[aria-checked="true"] { transform: translateY(-3%); z-index: 3; }
.rec[aria-checked="true"] .disc { transform: translateX(34%); }
.rec[aria-checked="true"] .vinyl { animation: spin 1.8s linear infinite; }
.rec[aria-checked="true"] .sleeve { box-shadow: 0 0 0 2px var(--glow) inset, 0 0 26px -2px var(--c1); }
@media (hover: hover) { .rec:not([aria-checked="true"]):hover { transform: translateY(36%); } }
.rec:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.lip {
  position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--S) * .45); z-index: 5; pointer-events: none; border-radius: 4px 4px 10px 10px;
  background: linear-gradient(180deg, #24123f, #0d0819 60%); border-top: 2px solid var(--hot);
  box-shadow: 0 -6px 22px -6px rgba(255, 63, 164, .8), inset 0 6px 14px -8px rgba(255, 63, 164, .9);
}
.rackhint { margin: 0; text-align: center; font-size: 14px; color: var(--muted); }
.detail { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; align-self: center; animation: rise .3s ease-out; }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dhead b { font-family: var(--display); font-weight: 400; font-size: 22px; text-shadow: 0 0 10px rgba(46, 242, 255, .6); }
.dhead .lv { font-family: var(--display); color: var(--glow); font-size: 16px; text-shadow: 0 0 8px rgba(46, 242, 255, .6); }
.detail > small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: -6px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .rec, .rec .disc { transition: none; } .rec[aria-checked="true"] .vinyl, .detail { animation: none; } }
.judges { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
.judges b { color: var(--ink); font-weight: 600; }
.judges .p { color: #7df3ff; } .judges .g { color: #b9f58a; } .judges .m { color: var(--danger); }
.grade { font-family: var(--display); font-size: 54px; line-height: 1; margin: 0; color: var(--glow); text-shadow: 0 0 6px #fff, 0 0 24px var(--glow); }

/* ---------- game ---------- */
.game {
  position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center;
  padding-inline: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  box-sizing: border-box; background: radial-gradient(90% 55% at 50% 45%, #1a1038 0%, rgba(7, 5, 15, 0) 72%);
  transition: background-color .4s;
}
.game::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .5s;
  background: radial-gradient(90% 60% at 50% 50%, rgba(255, 216, 77, .2) 0%, rgba(255, 63, 164, .1) 45%, rgba(255, 63, 164, 0) 75%);
}
.game.fever::before { opacity: 1; }
.game > * { width: 100%; max-width: 640px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back {
  font-family: var(--body); font-size: 14px; color: var(--muted); background: transparent; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
.back:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.snd {
  display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid var(--line); color: var(--muted);
}
.snd svg { width: 20px; height: 20px; }
.snd .off { display: none; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="false"] .off { display: block; }
.snd:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.topleft { display: flex; gap: 8px; align-items: center; }
.titlerow { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 6px; }
.titlerow .langsw { margin-top: 0; }
.titlerow .snd { width: 44px; height: 44px; border-radius: 999px; background: var(--board); }
.hud { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1; }
#mult.on { color: var(--fever); text-shadow: 0 0 10px var(--fever); }
.stat b { text-shadow: 0 0 10px rgba(244, 241, 255, .35); }
#count.warn { color: var(--danger); }
@media (max-width: 430px) {
  .topbar { gap: 8px; }
  .topleft { gap: 6px; }
  .topbar .back { padding: 7px 9px; font-size: 13px; }
  .topbar .snd { width: 34px; height: 34px; }
  .hud { gap: 10px; }
  .stat b { font-size: 18px; }
  .stat span { font-size: 10px; }
}
.lvrow { display: flex; align-items: center; gap: 10px; }
.lvrow b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--glow); min-width: 54px; text-shadow: 0 0 10px rgba(46, 242, 255, .7); }
.lvbar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }

  let tut = null;
  function tutShow(note) {
    const box = $('tutBox'), st = TUT_STEPS[tut.step];
    const cnt = st.need > 1 ? `<small>${t('tutCount', tut.n, st.need)}${note ? ' · ' + note : ''}</small>` : note ? `<small>${note}</small>` : '';
    box.innerHTML = t('tut')[tut.step] + cnt;
    box.classList.toggle('ok', note === t('tutGood'));
    box.hidden = false;
  }
  function tutGo(step) {
    tut.step = step; tut.n = 0; tut.at = sp;
    if (step === 2) bars.forEach(b => { b.charge = CFG[N].need - 1; });   // one slam away from full
    if (step === TUT_STEPS.length - 1) {
      try { localStorage.setItem('brickslam-tut', 'done'); } catch (e) {}
      sfx.levelUp();
    }
    tutShow();
  }
  function tutEvent(kind, j) {
    if (!tut || over) return;
    const st = tut.step;
    if (st === 0 && kind === 'slam') return tutGo(1);
    if (st === 1 && kind === 'push') {
      if (j < 2) { if (++tut.n >= 3) return tutGo(2); tutShow(t('tutGood')); }
      else tutShow(t('tutMiss'));
    }
    if (st === 2 && kind === 'full') return tutGo(3);
    if (st === 3 && kind === 'fever') return tutGo(4);
    if (st === 4 && kind === 'slam' && ++tut.n >= 4) return tutGo(5);
    if (st === 4 && kind === 'slam') tutShow();
  }
  // on each beat: top the board up to what the step wants; the last step closes after a few bars
  function tutBeat(bar) {
    if (tut.step === TUT_STEPS.length - 1) { if (sp - tut.at > 6 * song.spb) tutEnd(); return; }
    if (blocks.length + moving.length < TUT_STEPS[tut.step].want) spawn(performance.now(), bar);
  }
  function tutEnd() {
    tut = null; $('tutBox').hidden = true;
    goHome(); showView('shelfView');
    renderSongs(); showBest();
  }

  // one eighth-note slot of the chart: drop its bricks, announce drops and new kinds of brick
  function playSlot(k) {
    const bar = Math.floor(k / 8), s8 = k % 8;
    if (bar >= song.bars) return;
    if (tut) { if (s8 % 2 === 0) tutBeat(bar); return; }
    if (s8 === 0) {
      const fresh = Object.keys(kinds).find(x => kinds[x] === bar && bar > 0);
      if (fresh) { forceType = fresh; banner = { title: t(KINDS[fresh]), sub: '', life: 1 }; }
      else if (song.drop[bar]) banner = { title: t('drop'), sub: '', life: 0.7 };
    }
    const now = performance.now();
    for (let i = 0; i < barPat(song, bar)[s8] && !over; i++) spawn(now, bar);
  }

  const fever = () => sp < feverUntil;

  function hud() {
    $('score').textContent = Math.floor(score).toLocaleString();
    const m = $('mult'); m.textContent = '×' + mult; m.classList.toggle('on', mult > 1);
    const c = $('count'); c.textContent = blocks.length + '/' + CFG[N].cap;
    c.classList.toggle('warn', blocks.length >= CFG[N].cap * 0.8);
  }

  function spawn(now, bar) {
    const empty = [];
    for (let i = 0; i < grid.length; i++) if (!grid[i]) empty.push(i);
    if (!empty.length) return gameOver();
    const i = empty[Math.floor(Math.random() * empty.length)];
    const type = pickType(bar);
    const b = { x: i % N, y: Math.floor(i / N), born: now, type, hp: type === 'stone' ? 2 : 1 };
    grid[i] = b; blocks.push(b);
    if (blocks.length >= N * N) { hud(); return gameOver(); }
    sfx.spawn(blocks.length / (N * N));
    hud();
  }

  // judge a push against the nearest beat; ts is the input event's timestamp
  function judge(ts) {
    // sp was taken at the last frame (time `last`); move it to the moment of the input
    const at = sp + ((ts || performance.now()) - last) / 1000 - calib;
    const ph = at / song.spb, err = Math.abs(ph - Math.round(ph)) * song.spb;
    const j = err <= WIN_PERFECT ? 0 : err <= WIN_GREAT ? 1 : 2;
    judges[j]++;
    combo = j < 2 ? combo + 1 : 0;
    maxCombo = Math.max(maxCombo, combo);
    if (j === 2) sfx.miss();
    lastJ = { j, t: performance.now() };
    return j;
  }

  function push(b, d, ts) {
    if (!blocks.includes(b)) return;
    const { dx, dy } = DIRS[d];
    const j = judge(ts);
    tutEvent('push', j);
    const jx = M + ((b.slide ? b.slide.fx : b.x) + 0.5) * cell, jy = M + ((b.slide ? b.slide.fy : b.y) + 0.5) * cell;
    pops.push({ x: jx, y: jy - cell * 0.3, text: t('judgeNames')[j], life: 1, c: JUDGE_COL[j], small: true });
    // slide until the wall or the cell before another brick
    let x = b.x, y = b.y;
    while (x + dx >= 0 && x + dx < N && y + dy >= 0 && y + dy < N && !grid[(y + dy) * N + x + dx]) { x += dx; y += dy; }
    const toWall = !(x + dx >= 0 && x + dx < N && y + dy >= 0 && y + dy < N);
    const sx = b.slide ? b.slide.fx : b.x, sy = b.slide ? b.slide.fy : b.y;
    if (toWall) {
      grid[b.y * N + b.x] = null;
      blocks.splice(blocks.indexOf(b), 1);
      // the slam lands on the next 16th note, so every hit is in time with the music
      const dist = d === 0 ? sy : d === 1 ? N - 1 - sx : d === 2 ? N - 1 - sy : sx;
      const s16 = song.spb / 4, s1 = Math.ceil((sp + dist / 28 + 0.03) / s16) * s16;
      moving.push({ fx: sx, fy: sy, x0: sx, y0: sy, dist, s0: sp, s1, d, j, type: b.type, hp: b.hp });
      if (b === selected) selected = null;
      if (b === hover) hover = null;
      sfx.slide();
      sfx.slam(d, mult > 1, sfx.when(s1), j === 0);
    } else if (x === b.x && y === b.y) {
      b.bump = { d, t: 1 };   // blocked right away
      sfx.bump();
    } else {
      grid[b.y * N + b.x] = null;
      grid[y * N + x] = b;
      b.x = x; b.y = y;
      b.slide = { fx: sx, fy: sy, d };
      sfx.slide();
    }
    hud();
  }

  function chargeBar(bar, n) {
    if (bar.full) return;
    bar.charge = Math.min(CFG[N].need, bar.charge + n);
    if (bar.charge >= CFG[N].need) { bar.full = true; bar.flash = 1; sfx.charged(); tutEvent('full'); }
  }

  function burst(x, y, d, cols, n, speed = 1) {
    if (reduceMotion) n = Math.min(n, 3);
    const { dx, dy } = DIRS[d] || { dx: 0, dy: 0 };
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (40 + Math.random() * 180) * speed;
      parts.push({ x, y, vx: Math.cos(a) * sp - dx * 90, vy: Math.sin(a) * sp - dy * 90, life: 1, s: 2 + Math.random() * 4, c: cols[i % cols.length] });
    }
  }

  function removeBrick(b) {
    grid[b.y * N + b.x] = null;
    blocks.splice(blocks.indexOf(b), 1);
    if (b === selected) selected = null;
    if (b === hover) hover = null;
    if (drag && drag.b === b) drag = null;
  }

  function hit(m, now) {
    const k = m.type || 'n';
    tutEvent('slam');
    // points: timing judgement x combo (up to x2 at 50) x Fever x gold
    let pts = Math.round(10 * JUDGE_MUL[m.j] * (1 + Math.min(combo, 50) / 50) * mult * (k === 'gold' ? 3 : 1));
    chargeBar(bars[m.d], k === 'rain' ? CFG[N].need : (k === 'gold' ? 2 : 1) + (m.j === 0 ? 1 : 0));
    if (k === 'gold') sfx.gold();
    // impact point on the wall
    const ex = Math.round(m.fx), ey = Math.round(m.fy);
    const cx = M + (m.fx + 0.5) * cell, cy = M + (m.fy + 0.5) * cell;
    const ix = m.d === 1 ? S - M : m.d === 3 ? M : cx;
    const iy = m.d === 0 ? M : m.d === 2 ? S - M : cy;
    bars[m.d].spots.push({ pos: (m.d === 0 || m.d === 2) ? m.fx : m.fy, t: 1 });
    const col = k === 'rain' ? ['#ff5a7a', '#ffcf4a', '#4ae08a', '#4ab0ff', '#b36bff'] : KIND_COL[k].slice(0, 2);
    burst(ix, iy, m.d, col, 14);
    rings.push({ x: ix, y: iy, life: 1, c: k === 'gold' ? '#ffe68f' : C.glow });
    shake = Math.max(shake, 4 + Math.min(combo, 6));
    if (k === 'stone' && m.hp > 1) {
      // a stone cracks and bounces back onto the edge cell
      sfx.crack();
      if (!grid[ey * N + ex]) { const b = { x: ex, y: ey, born: now, type: 'stone', hp: 1 }; grid[ey * N + ex] = b; blocks.push(b); }
    }
    if (k === 'bomb') {
      sfx.boom();
      shake = 16; flash = Math.max(flash, 0.6);
      rings.push({ x: M + (ex + 0.5) * cell, y: M + (ey + 0.5) * cell, life: 1, c: C.danger, big: true });
      for (const b of blocks.slice()) {
        if (Math.abs(b.x - ex) <= 1 && Math.abs(b.y - ey) <= 1) {
          removeBrick(b);
          const p = 20 * mult;
          pts += p;
          const bx = M + (b.x + 0.5) * cell, by = M + (b.y + 0.5) * cell;
          burst(bx, by, -1, KIND_COL[b.type === 'rain' || !KIND_COL[b.type] ? 'n' : b.type].slice(0, 2), 12, 1.3);
          pops.push({ x: bx, y: by, text: '+' + p, life: 1, hot: true });
        }
      }
    }
    score += pts;
    pops.push({ x: cx, y: cy, text: '+' + pts, life: 1, hot: mult > 1 || m.j === 0 || k === 'gold' });
    hud();
  }

  function triggerFever(d) {
    const bar = bars[d];
    if (!bar.full) return;
    bar.full = false; bar.charge = 0; bar.flash = 0;
    if (fever()) { mult += 1; feverUntil += FEVER_EXTEND_BEATS * song.spb; }
    else { mult = 2; feverUntil = sp + FEVER_BEATS * song.spb; }
    feverTotal = feverUntil - sp;
    tutEvent('fever');
    flash = 1;
    sfx.fever(mult);
    hud();
  }

  // ends the song: won = survived to the end of the music
  function gameOver(won) {
    over = true; drag = null; banner = null; cleared = !!won;
    if (feverShown) { feverShown = false; $('game').classList.remove('fever'); }
    hooks.gameStop();
    score = Math.floor(score);
    const isBest = score > best;
    if (!won) sfx.music('off');   // a clear lets the closing chord ring out
    sfx.over(won || (isBest && score > 0));
    if (isBest && !song.tutorial) { best = score; try { localStorage.setItem(bestKey(song, N), best); } catch (e) {} }
    showBest();
    renderSongs();
    $('overTitle').textContent = t(won ? 'clearTitle' : 'overTitle');
    const tot = judges[0] + judges[1] + judges[2], acc = tot ? (judges[0] + 0.6 * judges[1]) / tot : 0;
    $('grade').textContent = acc >= 0.9 ? 'S' : acc >= 0.75 ? 'A' : acc >= 0.55 ? 'B' : 'C';
    $('grade').hidden = !won;
    const jn = t('judgeNames');
    $('judges').innerHTML = ['p', 'g', 'm'].map((c, i) => `<span class="${c}">${jn[i]} <b>${judges[i]}</b></span>`).join('') +
      `<span>${t('maxCombo')} <b>${maxCombo}</b></span>`;
    $('finalScore').textContent = score.toLocaleString();
    $('finalBest').textContent = best.toLocaleString();
    $('newBest').hidden = !isBest || score === 0;
    $('overOv').hidden = false;
    submitScore(N, score);
    // let players name themselves right on the result card
    if (!$('nickRow').hidden) $('retryBtn').before($('nickRow'));
    $('retryBtn').focus();
  }

  // ---------- input ----------
  function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function barAt(p) {
    const inX = p.x > M && p.x < S - M, inY = p.y > M && p.y < S - M;
    if (p.y < M && inX) return 0;
    if (p.x > S - M && inY) return 1;
    if (p.y > S - M && inX) return 2;
    if (p.x < M && inY) return 3;
    return -1;
  }
  function blockNear(p) {
    const gx = (p.x - M) / cell, gy = (p.y - M) / cell;
    const exact = grid[Math.floor(gy) * N + Math.floor(gx)];
    if (gx >= 0 && gy >= 0 && gx < N && gy < N && exact) return exact;
    let bestB = null, bd = 1.1;
    for (const b of blocks) {
      const d = Math.hypot(b.x + 0.5 - gx, b.y + 0.5 - gy);
      if (d < bd) { bd = d; bestB = b; }
    }
    return bestB;
  }
  cv.addEventListener('pointerdown', e => {
    if (over) return;
    const p = pt(e);
    const bi = barAt(p);
    if (bi >= 0) { triggerFever(bi); return; }
    const b = blockNear(p);
    if (!b) return;
    selected = b;
    drag = { b, x0: p.x, y0: p.y };
    cv.setPointerCapture(e.pointerId);
  });
  function brickAt(p) {
    const gx = Math.floor((p.x - M) / cell), gy = Math.floor((p.y - M) / cell);
    return gx >= 0 && gy >= 0 && gx < N && gy < N ? grid[gy * N + gx] : null;
  }
  let mouseAt = null;
  cv.addEventListener('pointerleave', () => { hover = null; mouseAt = null; });
  cv.addEventListener('pointermove', e => {
    if (over) return;
    if (!drag) { if (e.pointerType === 'mouse') { mouseAt = pt(e); hover = brickAt(mouseAt); } return; }
    const p = pt(e), dx = p.x - drag.x0, dy = p.y - drag.y0;
    if (Math.hypot(dx, dy) < Math.max(10, Math.min(28, cell * 0.25))) return;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    push(drag.b, d, e.timeStamp);
    drag = null;
  });
  const endDrag = () => { drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', e => {
    if (over) return;
    const map = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
    if (e.key in map) {
      e.preventDefault();
      // on a computer: point at a brick with the mouse, then push it with the arrows
      if (hover && blocks.includes(hover)) { push(hover, map[e.key], e.timeStamp); hover = mouseAt && brickAt(mouseAt); }
    } else if (e.key === 'f' || e.key === 'F' || e.key === ' ') {
      e.preventDefault();
      const d = bars.findIndex(b => b.full);
      if (d >= 0) triggerFever(d);
    }
  });

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function starPath(cx, cy, R, r, n = 5) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / n, d = i % 2 ? r : R;
      ctx.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d);
    }
    ctx.closePath();
  }

  function drawBrick(x, y, s, b, now, sel) {
    const type = (b && b.type) || 'n';
    const pad = cell * 0.07, size = (cell - pad * 2) * s;
    if (size < 2) return;
    const px = M + x * cell + (cell - size) / 2, py = M + y * cell + (cell - size) / 2;
    const r = Math.min(14, size * 0.18);
    let hi, mid, lo;
    if (type === 'rain') {
      const h = reduceMotion ? 300 : (now / 6) % 360;
      hi = `hsl(${h},95%,74%)`; mid = `hsl(${(h + 60) % 360},85%,58%)`; lo = `hsl(${(h + 60) % 360},65%,30%)`;
    } else [hi, mid, lo] = KIND_COL[type];
    // neon tube: dark glass body, glowing outline, white-hot core line
    const feverTint = type === 'n' && !over && fever();
    if (feverTint) [hi, mid] = ['#fff6c2', C.fever];
    const lw = Math.max(2, size * 0.075), inset = lw / 2;
    ctx.save();
    let g;
    if (type === 'rain') {
      const h = reduceMotion ? 300 : (now / 6) % 360;
      g = ctx.createLinearGradient(px, py, px + size, py + size);
      for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsl(${(h + i * 72) % 360},95%,62%)`);
      ctx.fillStyle = 'rgba(20,10,40,.75)';
    } else {
      const body = ctx.createLinearGradient(px, py, px, py + size);
      body.addColorStop(0, hexA(mid, 0.38)); body.addColorStop(1, hexA(lo, 0.9));
      ctx.fillStyle = body; g = mid;
    }
    rr(px, py, size, size, r); ctx.fill();
    ctx.shadowColor = type === 'rain' ? '#fff' : mid; ctx.shadowBlur = size * (0.14 + 0.22 * beatGlow);
    ctx.strokeStyle = g; ctx.lineWidth = lw;
    rr(px + inset, py + inset, size - lw, size - lw, Math.max(1, r - inset)); ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = type === 'rain' ? 'rgba(255,255,255,.85)' : hi; ctx.lineWidth = Math.max(1, lw * 0.32);
    ctx.globalAlpha = 0.65 + 0.35 * beatGlow;
    rr(px + inset, py + inset, size - lw, size - lw, Math.max(1, r - inset)); ctx.stroke();
    ctx.restore();
    if (size > 12) {
      const cx = px + size / 2, cy = py + size * 0.47;
      if (type === 'n') {
        ctx.save(); ctx.globalAlpha = 0.35 + 0.5 * beatGlow; ctx.strokeStyle = mid; ctx.lineWidth = Math.max(1, size * 0.03);
        ctx.shadowColor = mid; ctx.shadowBlur = 6;
        rr(px + size * 0.3, py + size * 0.3, size * 0.4, size * 0.4, size * 0.06); ctx.stroke(); ctx.restore();
      } else if (type === 'gold') {
        const tw = reduceMotion ? 1 : 0.85 + 0.15 * Math.sin(now / 180 + x * 3 + y);
        ctx.save(); ctx.shadowColor = mid; ctx.shadowBlur = 10;
        ctx.fillStyle = '#fff7d6'; starPath(cx, cy, size * 0.22 * tw, size * 0.1 * tw); ctx.fill(); ctx.restore();
      } else if (type === 'stone') {
        ctx.strokeStyle = hexA(mid, 0.7); ctx.lineWidth = Math.max(1, size * 0.04); ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px + size * 0.2, py + size * 0.33); ctx.lineTo(px + size * 0.42, py + size * 0.33);
        ctx.moveTo(px + size * 0.58, py + size * 0.6); ctx.lineTo(px + size * 0.8, py + size * 0.6);
        ctx.stroke();
        if (b && b.hp < 2) {   // cracked: one more slam breaks it
          ctx.strokeStyle = hi; ctx.lineWidth = Math.max(1.5, size * 0.045); ctx.shadowColor = mid; ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(px + size * 0.5, py + size * 0.06); ctx.lineTo(px + size * 0.42, py + size * 0.3);
          ctx.lineTo(px + size * 0.56, py + size * 0.46); ctx.lineTo(px + size * 0.46, py + size * 0.72);
          ctx.moveTo(px + size * 0.56, py + size * 0.46); ctx.lineTo(px + size * 0.76, py + size * 0.4);
          ctx.stroke();
        }
      } else if (type === 'bomb') {
        const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(now / 110);
        ctx.fillStyle = '#121019'; ctx.beginPath(); ctx.arc(cx, cy + size * 0.04, size * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = C.danger; ctx.globalAlpha = 0.5 + 0.5 * pulse; ctx.lineWidth = Math.max(1.5, size * 0.04);
        ctx.beginPath(); ctx.arc(cx, cy + size * 0.04, size * 0.22, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
        ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = Math.max(1, size * 0.035);
        ctx.beginPath(); ctx.moveTo(cx + size * 0.12, cy - size * 0.13); ctx.quadraticCurveTo(cx + size * 0.2, cy - size * 0.3, cx + size * 0.3, cy - size * 0.26); ctx.stroke();
        ctx.save(); ctx.shadowColor = C.glow; ctx.shadowBlur = 8 + 10 * pulse; ctx.fillStyle = pulse > 0.5 ? '#fff3c4' : C.glow;
        ctx.beginPath(); ctx.arc(cx + size * 0.3, cy - size * 0.26, size * (0.04 + 0.03 * pulse), 0, Math.PI * 2); ctx.fill(); ctx.restore();
      } else if (type === 'rain') {
        ctx.fillStyle = 'rgba(255,255,255,.92)'; starPath(cx, cy, size * 0.2, size * 0.06, 4); ctx.fill();
      }
    }
    if (sel) {
      ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.shadowColor = C.glow; ctx.shadowBlur = 12;
      rr(px - 4, py - 4, size + 8, size + 8, r + 4); ctx.stroke(); ctx.restore();
    }
  }

  function barRect(d) {
    const t = M * 0.42, o = (M - t) / 2;
    if (d === 0) return [M, o, B, t];
    if (d === 1) return [S - M + o, M, t, B];
    if (d === 2) return [M, S - M + o, B, t];
    return [o, M, t, B];
  }

  function drawBar(d, now, isFever) {
    const bar = bars[d], [x, y, w, h] = barRect(d), horiz = d === 0 || d === 2;
    const r = Math.min(w, h) / 2;
    ctx.fillStyle = C.line; rr(x, y, w, h, r); ctx.fill();
    if (isFever) { ctx.strokeStyle = C.fever; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5; rr(x, y, w, h, r); ctx.stroke(); ctx.globalAlpha = 1; }
    const frac = bar.full ? 1 : bar.charge / CFG[N].need;
    if (frac > 0) {
      const len = (horiz ? w : h) * frac;
      const fx = horiz ? x + (w - len) / 2 : x, fy = horiz ? y : y + (h - len) / 2;
      const fw = horiz ? len : w, fh = horiz ? h : len;
      ctx.save();
      if (bar.full) {
        const pulse = reduceMotion ? 0.7 : 0.5 + 0.5 * Math.sin(now / 140);
        ctx.shadowColor = C.glow; ctx.shadowBlur = 18 + 22 * pulse + 40 * bar.flash;
        ctx.fillStyle = C.glow; rr(fx, fy, fw, fh, r); ctx.fill();
        ctx.shadowBlur = 0; ctx.globalAlpha = 0.55 + 0.45 * pulse;
        ctx.fillStyle = C.ink;
        const core = Math.min(w, h) * 0.3;
        if (horiz) rr(fx + 4, fy + (fh - core) / 2, fw - 8, core, core / 2); else rr(fx + (fw - core) / 2, fy + 4, core, fh - 8, core / 2);
        ctx.fill();
      } else {
        ctx.globalAlpha = 0.3 + 0.6 * frac;
        ctx.shadowColor = C.glow; ctx.shadowBlur = 4 + 12 * frac;

  async function submitScore(n, pts) {
    const el = $('ranked'); el.hidden = true;
    // rhythm prototype: scores use a different scale, so they stay off the live ranking until it gets per-song boards
    if (RHYTHM_PROTO) return;
    if (!fs || !myId || pts <= 0) return;
    const prev = Number((myData && myData['best' + n]) || 0);
    if (pts <= prev) return;
    const ok = await writeMine({ nick: currentNick(), ['best' + n]: Math.floor(pts), ['t' + n]: Date.now() });
    if (ok) { el.textContent = t('ranked', n); el.hidden = false; }
  }

  (async () => {
    renderRank();
    if (!FIREBASE_CONFIG) return;
    try {
      const [appMod, authMod, fsMod] = await Promise.all([
        import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-firestore.js')
      ]);
      const app = appMod.initializeApp(FIREBASE_CONFIG);
      api = fsMod; fs = fsMod.getFirestore(app);
      for (const n of [4, 5]) {
        const q = fsMod.query(fsMod.collection(fs, 'scores'), fsMod.orderBy('best' + n, 'desc'), fsMod.limit(10));
        fsMod.onSnapshot(q, snap => {
          boards[n] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(r => Number(r['best' + n]) > 0);
          if (n === rankTab) renderRank();
        }, () => { rankFailed = true; if (n === rankTab) renderRank(); });
      }
      const auth = authMod.getAuth(app);
      const cred = auth.currentUser ? { user: auth.currentUser } : await authMod.signInAnonymously(auth);
      myId = cred.user.uid;
      $('nickRow').hidden = false;
      const mine = await fsMod.getDoc(fsMod.doc(fs, 'scores', myId));
      myData = mine.exists() ? mine.data() : null;
      if (myData && myData.nick && !$('nick').value) $('nick').value = myData.nick;
      renderRank();
    } catch (e) {
      rankFailed = true; fs = null; renderRank();
    }
  })();

  $('retryBtn').addEventListener('click', () => play());
  $('menuBtn').addEventListener('click', goHome);
  $('backBtn').addEventListener('click', goHome);

  document.addEventListener('visibilitychange', () => {
    const now = performance.now();
    sfx.pause(document.hidden);
    if (document.hidden) hiddenAt = now;
    else hiddenAt = 0;   // the song clock (audio) pauses with the tab, so nothing to shift
  });
  window.addEventListener('resize', () => { if (grid) layout(); });

  reset(); over = true;   // empty state until a game starts
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
