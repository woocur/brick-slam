<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131f">
<meta name="description" content="Brick Slam · 브릭 슬램. Push bricks into the walls, tap a glowing wall for Fever, and beat your friends on the ranking.">
<meta property="og:title" content="Brick Slam · 브릭 슬램">
<meta property="og:description" content="벽돌을 밀어서 벽에 쾅! 빛나는 벽을 눌러 피버. 친구들과 랭킹 겨루기.">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315131f'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='%23c4623a'/%3E%3Crect x='28' y='4' width='3' height='24' rx='1.5' fill='%23ffb547'/%3E%3C/svg%3E">
<title>Brick Slam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: phone-first. A scrolling home (hero board, start buttons, how-to) and a fixed full-screen game view: HUD strip, square board framed by four charge bars. Deliberately single dark theme. */
:root {
  --ground: #15131f;
  --board: #1e1b2d;
  --line: #2c2843;
  --brick: #c4623a;
  --brick-hi: #e98d5f;
  --brick-lo: #7f3a20;
  --glow: #ffb547;
  --fever: #ff4f8b;
  --ink: #efe9f7;
  --muted: #9a93b0;
  --danger: #ff5a4e;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--body);
  margin: 0; overscroll-behavior: none; word-break: keep-all;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
body.playing { overflow: hidden; touch-action: none; }
button { touch-action: manipulation; }

/* ---------- home ---------- */
.home {
  max-width: 440px; margin-inline: auto; padding-inline: 20px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  display: flex; flex-direction: column; gap: 28px; box-sizing: border-box;
}
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 18vw, 76px); line-height: .95; margin: 0; letter-spacing: .01em; }
.hero h1 em { font-style: normal; color: var(--glow); }
.hero p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--muted); text-wrap: balance; }
.hero p b { color: var(--ink); font-weight: 600; }

.mini { --u: min(54px, 13vw); position: relative; width: calc(var(--u) * 4 + 52px); aspect-ratio: 1; max-width: 100%; align-self: center; }
.mini .grid {
  position: absolute; inset: 26px; background: var(--board); border-radius: 4px;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 25% 25%;
}
.mini .bar { position: absolute; background: var(--line); border-radius: 6px; }
.mini .bar.t { top: 8px; left: 26px; right: 26px; height: 10px; }
.mini .bar.b { bottom: 8px; left: 26px; right: 26px; height: 10px; }
.mini .bar.l { left: 8px; top: 26px; bottom: 26px; width: 10px; }
.mini .bar.r { right: 8px; top: 26px; bottom: 26px; width: 10px; overflow: visible; }
.mini .bar.r::after {
  content: ""; position: absolute; inset: 0; border-radius: 6px; background: var(--glow);
  animation: charge 2.4s infinite;
}
.mini .bar.t::after { content: ""; position: absolute; left: 35%; right: 35%; top: 0; bottom: 0; border-radius: 6px; background: var(--glow); opacity: .5; }
.mini .brick { position: absolute; width: calc(25% - 6px); aspect-ratio: 1; border-radius: 5px; background: var(--brick); box-shadow: inset 0 -5px 0 var(--brick-lo), inset 0 4px 0 -1px var(--brick-hi); }
.mini .grid { overflow: hidden; }
.mini .s1 { left: 3px; top: calc(25% + 3px); animation: slide 2.4s infinite cubic-bezier(.5, 0, .9, .6); }
.mini .s2 { left: calc(50% + 3px); top: calc(75% + 3px); }
.mini .s3 { left: calc(25% + 3px); top: 3px; }
@keyframes slide {
  0%, 25% { transform: translateX(0); opacity: 1; }
  55% { transform: translateX(calc(300% + 18px)); opacity: 1; }
  60%, 100% { transform: translateX(calc(300% + 18px)); opacity: 0; }
}
@keyframes charge {
  0%, 54% { opacity: .35; transform: scaleY(.45); box-shadow: none; }
  57% { opacity: 1; transform: scaleY(1); box-shadow: 0 0 22px 4px var(--glow); }
  100% { opacity: .9; transform: scaleY(1); box-shadow: 0 0 12px 1px var(--glow); }
}

.play { display: flex; flex-direction: column; gap: 10px; }
.btn {
  font-family: var(--display); font-size: 22px; padding: 14px 0; border-radius: 10px; border: 0;
  background: var(--glow); color: var(--ground); cursor: pointer; width: 100%;
  display: flex; justify-content: center; align-items: baseline; gap: 8px;
}
.btn small { font-family: var(--body); font-size: 13px; opacity: .75; }
.btn.alt { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bestline { margin: 0; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bestline b { color: var(--ink); font-weight: 600; }

.how h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 12px; }
.how ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
.how li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; counter-increment: step; }
.how li::before {
  content: counter(step); font-family: var(--display); font-size: 18px; width: 34px; height: 34px; border-radius: 8px;
  display: grid; place-items: center; background: var(--board); color: var(--glow); border: 1px solid var(--line);
}
.how li div { min-width: 0; font-size: 15px; line-height: 1.55; }
.how li b { display: block; font-weight: 600; margin-bottom: 2px; }
.how li span { color: var(--muted); }
.how .end { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.how .end b { color: var(--danger); font-weight: 600; }

/* ---------- game ---------- */
.game {
  position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center;
  padding-inline: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  box-sizing: border-box; background: var(--ground);
}
.game > * { width: 100%; max-width: 640px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back {
  font-family: var(--body); font-size: 14px; color: var(--muted); background: transparent; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
.back:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.hud { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1; }
#mult.on { color: var(--fever); }
#count.warn { color: var(--danger); }
.feverbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.feverbar i { display: block; height: 100%; width: 0; background: var(--fever); }
.stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; max-width: 100%; }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
.hint .keys { display: none; }
@media (hover: hover) and (pointer: fine) { .hint .keys { display: inline; } }
kbd { font-family: var(--body); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--ink); }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.card {
  background: rgba(21, 19, 31, .94); border: 1px solid var(--line); border-radius: 12px;
  padding: 22px; max-width: 320px; width: calc(100% - 32px); box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
}
.card h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; text-wrap: balance; }
.result { display: flex; gap: 24px; font-variant-numeric: tabular-nums; }
.result div { display: flex; flex-direction: column; gap: 2px; }
.result span { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.result b { font-family: var(--display); font-weight: 400; font-size: 32px; }
.newbest { color: var(--glow); font-size: 14px; margin: 0; }
.rank h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
.rank { display: flex; flex-direction: column; gap: 12px; }
.rank-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tabs { display: flex; gap: 4px; background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button {
  font-family: var(--body); font-size: 13px; padding: 5px 10px; border: 0; border-radius: 6px; cursor: pointer;
  background: transparent; color: var(--muted); font-variant-numeric: tabular-nums;
}
.tabs button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
.tabs button:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
.board-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.board-list li {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
  padding: 10px 14px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line);
}
.board-list li:first-child { border-top: 0; }
.board-list .pos { font-family: var(--display); font-size: 17px; color: var(--muted); }
.board-list li:nth-child(1) .pos { color: var(--glow); }
.board-list .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.board-list .me { background: var(--board); }
.board-list .me .who::after { content: " · " attr(data-me); color: var(--glow); font-size: 13px; }
.board-list .pts { font-family: var(--display); font-size: 18px; }
.board-list .empty { display: block; color: var(--muted); font-size: 14px; text-align: center; padding: 18px 14px; }
.nick { display: flex; gap: 8px; align-items: center; }
.nick label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.nick input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--board);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; -webkit-user-select: text; user-select: text;
}
.nick input:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; border-color: transparent; }
.rank-note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.ranked { margin: 0; font-size: 14px; color: var(--ink); }
.langbar { display: flex; justify-content: flex-end; }
.lang { display: flex; gap: 4px; background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.lang button { font-family: var(--body); font-size: 13px; padding: 5px 10px; border: 0; border-radius: 6px; cursor: pointer; background: transparent; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
.lang button:focus-visible { outline: 2px solid var(--glow); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .mini .s1, .mini .bar.r::after { animation: none; } }
</style>
</head>
<body>

<main class="home" id="home">
  <div class="langbar">
    <div class="lang" role="group" aria-label="Language">
      <button id="langKo" lang="ko" aria-pressed="true">한국어</button>
      <button id="langEn" lang="en" aria-pressed="false">English</button>
    </div>
  </div>
  <section class="hero">
    <h1 data-i18n-html="titleHtml">브릭 <em>슬램</em></h1>
    <p data-i18n-html="tagline"></p>
  </section>
  <div class="mini" aria-hidden="true">
    <div class="bar t"></div><div class="bar r"></div><div class="bar b"></div><div class="bar l"></div>
    <div class="grid"><div class="brick s1"></div><div class="brick s2"></div><div class="brick s3"></div></div>
  </div>
  <section class="play">
    <button class="btn" id="start4" data-i18n-html="start4"></button>
    <button class="btn alt" id="start5" data-i18n-html="start5"></button>
    <p class="bestline" id="bestLine"></p>
  </section>
  <section class="rank" id="rank">
    <div class="rank-head">
      <h2 data-i18n="ranking"></h2>
      <div class="tabs" role="group" data-i18n-aria="boardSize">
        <button id="tab4" aria-pressed="true">4 × 4</button>
        <button id="tab5" aria-pressed="false">5 × 5</button>
      </div>
    </div>
    <ol class="board-list" id="rankList"><li class="empty"></li></ol>
    <div class="nick" id="nickRow" hidden>
      <label for="nick" data-i18n="nickLabel"></label>
      <input id="nick" maxlength="12" autocomplete="nickname" data-i18n-ph="nickPh">
    </div>
    <p class="rank-note" id="rankNote" hidden></p>
  </section>
  <section class="how">
    <h2 data-i18n="howTitle"></h2>
    <ol>
      <li><div><b data-i18n="how1t"></b><span data-i18n="how1"></span></div></li>
      <li><div><b data-i18n="how2t"></b><span data-i18n="how2"></span></div></li>
      <li><div><b data-i18n="how3t"></b><span data-i18n="how3"></span></div></li>
    </ol>
    <p class="end" data-i18n-html="howEnd"></p>
  </section>
</main>

<div class="game" id="game" hidden>
  <div class="topbar">
    <button class="back" id="backBtn" data-i18n="quit"></button>
    <div class="hud">
      <div class="stat"><span data-i18n="score"></span><b id="score">0</b></div>
      <div class="stat"><span data-i18n="mult"></span><b id="mult">×1</b></div>
      <div class="stat"><span data-i18n="bricks"></span><b id="count">0/16</b></div>
      <div class="stat"><span data-i18n="best"></span><b id="best">0</b></div>
    </div>
  </div>
  <div class="feverbar" aria-hidden="true"><i id="feverfill"></i></div>
  <div class="stage" id="stage">
    <canvas id="cv" data-i18n-aria="boardAria"></canvas>
    <div class="overlay" id="overOv" hidden>
      <div class="card">
        <h2 data-i18n="overTitle"></h2>
        <div class="result">
          <div><span data-i18n="score"></span><b id="finalScore">0</b></div>
          <div><span data-i18n="best"></span><b id="finalBest">0</b></div>
        </div>
        <p class="newbest" id="newBest" data-i18n="newBest" hidden></p>
        <p class="ranked" id="ranked" hidden></p>
        <button class="btn" id="retryBtn" data-i18n="retry"></button>
        <button class="btn alt" id="menuBtn" data-i18n="home"></button>
      </div>
    </div>
  </div>
  <p class="hint"><span data-i18n="hint"></span><span class="keys"> · <span data-i18n="keyboard"></span> <kbd>←↑↓→</kbd> <kbd>F</kbd></span></p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const css = getComputedStyle(document.documentElement);

  // 0 top, 1 right, 2 bottom, 3 left
  const DIRS = [{ dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: 0, dy: 1 }, { dx: -1, dy: 0 }];

  let N = 4, S = 0, M = 0, B = 0, cell = 0;

  function push(b, d) {

    while (x + dx >= 0 && x + dx < N && y + dy >= 0 && y + dy < N && !grid[(y + dy) * N + x + dx]) { x += dx; y += dy; }
    const toWall = !(x + dx >= 0 && x + dx < N && y + dy >= 0 && y + dy < N);

      api = fsMod; fs = fsMod.getFirestore(app);
      for (const n of [4, 5]) {
        const q = fsMod.query(fsMod.collection(fs, 'scores'), fsMod.orderBy('best' + n, 'desc'), fsMod.limit(10));
        fsMod.onSnapshot(q, snap => {
          boards[n] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(r => Number(r['best' + n]) > 0);
          if (n === rankTab) renderRank();
        }, () => { rankFailed = true; if (n === rankTab) renderRank(); });
      }
      const auth = authMod.getAuth(app);
      const cred = auth.currentUser ? { user: auth.currentUser } : await authMod.signInAnonymously(auth);
      myId = cred.user.uid;
      $('nickRow').hidden = false;
      const mine = await fsMod.getDoc(fsMod.doc(fs, 'scores', myId));
      myData = mine.exists() ? mine.data() : null;
      if (myData && myData.nick && !$('nick').value) $('nick').value = myData.nick;
      renderRank();
    } catch (e) {
      rankFailed = true; fs = null; renderRank();
    }
  })();

  $('start4').addEventListener('click', () => start(4));
  $('start5').addEventListener('click', () => start(5));
  $('retryBtn').addEventListener('click', () => start());
  $('menuBtn').addEventListener('click', goHome);
  $('backBtn').addEventListener('click', goHome);

  document.addEventListener('visibilitychange', () => {
    const now = performance.now();
    if (document.hidden) hiddenAt = now;
    else if (hiddenAt && !over) { const gap = now - hiddenAt; nextSpawn += gap; if (feverUntil > hiddenAt) feverUntil += gap; hiddenAt = 0; }
  });
  window.addEventListener('resize', () => { if (grid) layout(); });

  reset(); over = true;   // empty state until a game starts
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
